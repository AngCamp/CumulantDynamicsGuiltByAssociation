[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cumulant-dynamics-guilt-by-association"
version = "0.1.0"
description = "NWB/DANDI helpers for cumulant dynamics analysis"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
